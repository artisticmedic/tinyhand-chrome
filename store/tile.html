<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo tile</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 34px;
      background: #f6f1e7;
      color: #1d1d21;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    h1 { margin: 0; font-size: var(--title, 46px); letter-spacing: -0.03em; line-height: 1; }
    p { margin: 10px 0 0; font-size: var(--sub, 15px); color: #5b5650; max-width: 62%; line-height: 1.35; }
  </style>
</head>
<body>
  <h1 id="title">TinyHand</h1>
  <p id="sub">A tiny hand on a stick that points at things on any website</p>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('name')) document.getElementById('title').textContent = q.get('name');
    if (q.get('title')) document.documentElement.style.setProperty('--title', q.get('title'));
    if (q.get('sub')) document.documentElement.style.setProperty('--sub', q.get('sub'));
  </script>
</body>
</html>
